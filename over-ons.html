  <body>
    <div id="root"></div>
    <script type="text/babel" src="components/Shared.jsx"></script>
    <script type="text/babel">
      function Page() {
        return (
          <>
            <SharedHeader />
            <section className="subpage-hero light">
              <div className="container">
                <span className="eyebrow">Over ons</span>
                <h1>
                  <span className="hero-line-plain">Geen bureau.</span>
                  <span className="hero-line-accent">Een vangnet.</span>
                </h1>
                <p className="lead">
                  AIChecked.nl ontstond uit één observatie: AI maakt alles sneller, inclusief de fouten die niemand meer ziet.
                  Wij zijn opgericht om dat gat te dichten — niet met een eenmalige audit, maar met een doorlopend systeem.
                </p>
              </div>
            </section>

            <section className="about-section">
              <div className="container">
                <div className="about-grid">
                  <div className="about-block">
                    <span className="eyebrow">Waarom we bestaan</span>
                    <h2>Wat vandaag klopt,<br/><span className="hero-line-accent">klopt morgen niet meer.</span></h2>
                    <p>
                      Tools updaten zichzelf. Scripts schuiven door. Regels veranderen. AI genereert pagina's die niemand meer controleert.
                      Een eenmalige check is daarom geen oplossing — het is een momentopname die direct verloopt.
                    </p>
                    <p>
                      Wij doen het anders: we kijken doorlopend mee, lossen fouten op zodra ze ontstaan, en houden je op de hoogte via één portaal.
                    </p>
                  </div>
                  <div className="about-pillars">
                    <div className="about-pillar"><strong>Direct</strong><span>Geen tickets, geen tussenlagen. Wij pakken het op.</span></div>
                    <div className="about-pillar"><strong>Doorlopend</strong><span>Maandelijks bijgehouden — niet één keer per jaar.</span></div>
                    <div className="about-pillar"><strong>Duidelijk</strong><span>Je ziet exact wat we doen via het klantportaal.</span></div>
                  </div>
                </div>
              </div>
            </section>

            <section className="principles-section">
              <div className="container">
                <span className="eyebrow">Waar we voor staan</span>
                <h2>Drie principes,<br/><span className="hero-line-accent">één belofte.</span></h2>
                <div className="principles-grid">
                  <div className="principle-card">
                    <div className="principle-num">01</div>
                    <h3>Eerlijk over wat fout is</h3>
                    <p>Geen mooie rapporten, geen jargon. We laten zien wat niet klopt — en wat het je kost als je niets doet.</p>
                  </div>
                  <div className="principle-card">
                    <div className="principle-num">02</div>
                    <h3>Verantwoordelijk voor de fix</h3>
                    <p>Wij wijzen niet alleen aan. Wij lossen op. Technisch, juridisch, qua data.</p>
                  </div>
                  <div className="principle-card">
                    <div className="principle-num">03</div>
                    <h3>Aanwezig na de fix</h3>
                    <p>De echte waarde zit niet in de eerste check. Het zit in de 30e — als alles nog steeds klopt.</p>
                  </div>
                </div>
              </div>
            </section>

            <CalendarBookingBlock eyebrow="MAAK KENNIS" />

            <section className="cta-strip">
              <div className="container inner">
                <div>
                  <span className="eyebrow on-dark">Maak kennis</span>
                  <h2 style={{ marginTop: 18 }}>Liefst <span className="accent">een gesprek</span> dan een formulier?</h2>

                </div>
              </div>
            </section>

            <SharedFooter />
          </>
        );

      ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
