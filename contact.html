<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — AIChecked.nl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.v2.css" />
    <link rel="stylesheet" href="subpages.css" />
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" src="components/Shared.jsx"></script>
    <script type="text/babel">
      function Page() {
        const [intent, setIntent] = React.useState("email-marketing");
        const [submitted, setSubmitted] = React.useState(false);
        const [form, setForm] = React.useState({ name: "", email: "", company: "", url: "", note: "" });
        const update = (k) => (e) => setForm({ ...form, [k]: e.target.value });
        const submit = (e) => { e.preventDefault(); setSubmitted(true); };

        return (
          <>
            <SharedHeader />
            <section className="subpage-hero light">
              <div className="container">
                <span className="eyebrow">Contact</span>
                <h1>
                  <span className="hero-line-plain">Twee minuten typen.</span>
                  <span className="hero-line-accent">Vierentwintig uur reactie.</span>
                </h1>
                <p className="lead">
                  Vertel kort waar het over gaat. Wij komen binnen 24 uur terug met een concreet vervolg —
                  geen geautomatiseerd antwoord, geen sales-trechter.
                </p>
              </div>
            </section>

            <section className="contact-section">
              <div className="container">
                <div className="contact-grid">
                  <div className="contact-form-wrap">
                    {!submitted ? (
                      <form className="contact-form" onSubmit={submit}>
                        <div className="intent-row">
                          <span className="form-label">Waar gaat het over?</span>
                          <div className="intent-chips">
                            {[
                              { id: "email-marketing", label: "Emailmarketing" },
                              { id: "advertenties", label: "Advertenties" },
                              { id: "seo", label: "SEO" },
                              { id: "website-bouwen", label: "Website bouwen" },
                              { id: "branding", label: "Branding" },
                              { id: "data-tracking", label: "Data en tracking" },
                              { id: "compliance-twijfel", label: "Ik weet niet of mijn website voldoet aan de regels" },
                            ].map(o => (
                              <button
                                key={o.id} type="button"
                                className={`intent-chip ${intent === o.id ? "active" : ""}`}
                                onClick={() => setIntent(o.id)}
                              >{o.label}</button>
                            ))}
                          </div>
                        </div>
                        <div className="form-row two">
                          <label><span>Naam</span><input required value={form.name} onChange={update("name")} placeholder="Je naam" /></label>
                          <label><span>E-mail</span><input required type="email" value={form.email} onChange={update("email")} placeholder="naam@bedrijf.nl" /></label>
                        </div>
                        <div className="form-row two">
                          <label><span>Bedrijf</span><input value={form.company} onChange={update("company")} placeholder="Bedrijfsnaam" /></label>
                          <label><span>Website</span><input value={form.url} onChange={update("url")} placeholder="bedrijf.nl" /></label>
                        </div>
                        <label className="form-row"><span>Wat speelt er?</span>
                          <textarea rows="5" value={form.note} onChange={update("note")} placeholder="Eén of twee zinnen volstaat — context, urgentie, wat je al hebt geprobeerd." />
                        </label>
                        <button type="submit" className="btn btn-primary">Verstuur — 24u reactietijd <span className="arrow">→</span></button>
                        <p className="form-foot">Geen nieuwsbrief. Geen lijst. Eén persoon antwoordt persoonlijk.</p>
                      </form>
                    ) : (
                      <div className="contact-success">
                        <div className="success-mark">✓</div>
                        <h3>Verstuurd. Bedankt.</h3>
                        <p>We zijn er binnen 24 uur — meestal eerder. Tot snel.</p>
                      </div>
                    )}
                  </div>

                  <aside className="contact-aside">
                    <div className="contact-block">
                      <h5>Direct contact</h5>
                      <a className="contact-link" href="mailto:info@aichecked.nl">info@aichecked.nl</a>
                      <a className="contact-link" href="tel:+31619678372">+31 6 19678372</a>
                    </div>
                    <div className="contact-block">
                      <h5>Liever bellen?</h5>
                      <p>20 minuten, geen verkooppraat. Plan een tijd die je past.</p>
                      <a className="btn btn-secondary" href="https://calendar.google.com/calendar/appointments/schedules/AcZssZ1SPBgmZQ1XSYWQRkGAxUaSpRVhIIaFPBxq1EmTwHjVCdk_vOJT3Lloz3YUtpWrLd0rG-HTEPMS">Plan in agenda →</a>
                    </div>
                    <div className="contact-block">
                      <h5>Reactietijd</h5>
                      <p>Werkdagen binnen 24 uur. Spoedig? Bel direct.</p>
                    </div>
                    <div className="contact-block">
                      <h5>Vestiging</h5>
                      <p>Amsterdam — Singel 542<br/>KvK 92.041.227</p>
                    </div>
                  </aside>
                </div>
              </div>
            </section>

            <CalendarBookingBlock eyebrow="LIEVER DIRECT INPLANNEN?" />
            <SharedFooter />
          </>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
    </script>
  </body>
</html>
