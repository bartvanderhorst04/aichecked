      function relativeTime(isoString) {
        if (!isoString) return "";
        const now = Date.now();
        const diff = now - new Date(isoString).getTime();
        const hour = 60 * 60 * 1000;
        const day = 24 * hour;
        if (diff < hour) return "zojuist";
        if (diff < day) return `${Math.max(1, Math.floor(diff / hour))}u geleden`;
        if (diff < day * 2) return "gisteren";
        return new Date(isoString).toLocaleDateString("nl-NL", { day: "2-digit", month: "2-digit" });
      }

      function loadClients() {
        const stored = localStorage.getItem(CLIENTS_KEY);
        if (!stored) {
          localStorage.setItem(CLIENTS_KEY, JSON.stringify(seedClients));
          return seedClients;
        }
        try {
          const parsed = JSON.parse(stored);
          return parsed.map((client) => {
            const seed = seedClients.find((item) => item.id === client.id);
            return {
              ...client,
              modules: { compliance: false, ...client.modules },
              login: client.login || seed?.login || { email: "", password: "" },
              notifications: client.notifications || [],
              metricsByModule: (() => {
                if (client.metricsByModule) {
                  return {
                    email: normalizeModuleMetrics(client.metricsByModule.email),
                    seo: normalizeModuleMetrics(client.metricsByModule.seo),
                    ads: normalizeModuleMetrics(client.metricsByModule.ads),
                    compliance: normalizeModuleMetrics(client.metricsByModule.compliance),
                    website: normalizeModuleMetrics(client.metricsByModule.website),
                  };
                }
                const firstModule = getActiveServiceModules({ modules: { compliance: false, ...client.modules } })[0] || "email";
                const migrated = createMetricsByModule();
                migrated[firstModule] = normalizeModuleMetrics(client.metrics || seed?.metrics || []);
                return migrated;
              })(),
              primaryModule: (() => {
                const modules = getActiveServiceModules({ modules: { compliance: false, ...client.modules } });
                if (client.primaryModule && modules.includes(client.primaryModule)) return client.primaryModule;
                return modules[0] || "email";
              })(),
            };
          });
        } catch {
          localStorage.setItem(CLIENTS_KEY, JSON.stringify(seedClients));
          return seedClients;
        }

        const [adminError, setAdminError] = React.useState("");

        const currentClient = clients.find((client) => client.id === sessionClientId) || clients[0];

          const handleStorage = (event) => {
            if (event.key === CLIENTS_KEY) {
              setClients(loadClients());
            }
          };
          window.addEventListener("storage", handleStorage);
          return () => window.removeEventListener("storage", handleStorage);
        }, []);

        if (!sessionClientId) {

              clientEmail={clientEmail}
              setClientEmail={setClientEmail}
              clientPassword={clientPassword}
              setClientPassword={setClientPassword}
              adminEmail={adminEmail}
              setAdminEmail={setAdminEmail}
              adminPassword={adminPassword}
              setAdminPassword={setAdminPassword}
              clientError={clientError}
              adminError={adminError}
              onClientLogin={() => {
                if (!clientEmail.trim() || !clientPassword.trim()) {
                  setClientError("Vul een e-mailadres en wachtwoord in.");
                  return;
                }
                const matchedClient = clients.find(
                  (client) =>
                    client.login?.email?.toLowerCase() === clientEmail.trim().toLowerCase() &&
                    client.login?.password === clientPassword
                );
                if (!matchedClient) {
                  setClientError("E-mailadres of wachtwoord klopt niet.");
                  return;
                }
                localStorage.setItem(CLIENT_SESSION_KEY, matchedClient.id);
                setSessionClientId(matchedClient.id);
                setClientError("");
              }}
              onAdminLogin={() => {
                if (!adminEmail.trim() || !adminPassword.trim()) {
                  setAdminError("Vul een e-mailadres en wachtwoord in.");
                  return;
                }
                localStorage.setItem("aichecked_admin_session_v1", "true");

        const enabledModules = Object.entries(currentClient.modules)

        const activeServiceModules = getActiveServiceModules(currentClient);

        React.useEffect(() => {
          const fallback = currentClient.primaryModule && activeServiceModules.includes(currentClient.primaryModule)
            ? currentClient.primaryModule
            : (activeServiceModules[0] || "");
          if (activeSection === "dashboard") {
            setActiveMetricModule(fallback);
          } else if (activeServiceModules.includes(activeSection)) {
            setActiveMetricModule(activeSection);
          }
        }, [currentClient.id, currentClient.primaryModule, activeSection, activeServiceModules.join("|")]);

        React.useEffect(() => {
          if (activeSection !== "dashboard" && !enabledModules.includes(activeSection)) {
            setActiveSection("dashboard");
          }
        }, [activeSection, enabledModules]);

        const allFeedItems = enabledModules.flatMap((moduleKey) =>
          moduleMeta[moduleKey].feed.map((item) => ({ ...item, moduleKey, moduleLabel: moduleMeta[moduleKey].label }))
        );

        const adminFeedItems = (currentClient.notifications || []).map((item) => ({
          ...item,
          moduleKey: "admin",
          moduleLabel: "",
          isCustom: true,
        }));

        const combinedFeedItems = [...adminFeedItems, ...allFeedItems].sort((a, b) => {
          const aTime = a.createdAt ? new Date(a.createdAt).getTime() : 0;
          const bTime = b.createdAt ? new Date(b.createdAt).getTime() : 0;
          return bTime - aTime;
        });

        const visibleFeedItems = activeSection === "dashboard"
          ? combinedFeedItems
          : combinedFeedItems.filter((item) => item.moduleKey === activeSection || item.moduleKey === "admin");

        const filteredFeed = activeFilter === "Alles" ? visibleFeedItems : visibleFeedItems.filter((it) => {
          if (activeFilter === "Actie vereist") return it.type === "actie";
          if (activeFilter === "Uitgevoerd") return it.type === "uitgevoerd";
          if (activeFilter === "Voorstellen") return it.type === "voorstel";
          if (activeFilter === "Inzicht") return it.type === "inzicht";
          return true;
        });

        const metricModuleKey = activeSection === "dashboard"
          ? activeMetricModule
          : (activeServiceModules.includes(activeSection) ? activeSection : "");

        const metrics = metricModuleKey
          ? ((currentClient.metricsByModule?.[metricModuleKey] || []).filter((metric) => metric.label.trim() && metric.value.trim()))
          : [];

        const complianceChecks = activeSection === "dashboard"
          ? enabledModules.flatMap((key) => moduleMeta[key].compliance.map((item) => ({ label: item, moduleLabel: moduleMeta[key].label })))
          : (moduleMeta[activeSection]?.compliance || []).map((item) => ({ label: item, moduleLabel: moduleMeta[activeSection].label }));

        const projects = activeSection === "dashboard"
          ? enabledModules.flatMap((key) => (moduleMeta[key].projects || []).map((project) => ({ ...project, moduleKey: key, moduleLabel: moduleMeta[key].label })))
          : (moduleMeta[activeSection]?.projects || []).map((project) => ({ ...project, moduleKey: activeSection, moduleLabel: moduleMeta[activeSection].label }));

        return (
          <>
            <PortalHeader
              currentClientName={currentClient.company}
              onLogout={() => {
                localStorage.removeItem(CLIENT_SESSION_KEY);
                setSessionClientId("");
                setActiveSection("dashboard");
              }}
            />

            <section className="subpage-hero compact">
              <div className="grid-bg" />
              <div className="container">
                <span className="eyebrow on-dark">Klantportaal</span>
                <h1>
                  Alleen zichtbaar wat telt voor<br />
                  <span className="serif-italic">{currentClient.company}</span>
                </h1>
                <p className="lead-on-dark">
                  Geen irrelevante modules, geen lege onderdelen. Alleen dashboard, data en acties die bij dit pakket horen.
                </p>
              </div>
            </section>

            <section className="portal-v2-section">
              <div className="container">
                <div className="portal-shell portal-shell--client">
                  <Sidebar enabledModules={enabledModules} activeSection={activeSection} setActiveSection={setActiveSection} />

                  <main className="portal-main">
                    <div className="portal-main-head">
                      <div>
                        <span className="feed-eyebrow">Dashboard</span>
                        <h2>{activeSection === "dashboard" ? "Overzicht voor deze klant" : moduleMeta[activeSection].label}</h2>
                        <p>
                          {activeSection === "dashboard"
                            ? "Je ziet hier alleen metrics, checks en acties uit modules die voor jouw pakket actief zijn."
                            : moduleMeta[activeSection].summary}
                        </p>
                      </div>
                      <button className={`notif-pill ${notif ? "on" : ""}`} onClick={() => setNotif((n) => !n)}>
                        Notificaties {notif ? "aan" : "uit"}
                      </button>
                    </div>

                    {activeSection === "dashboard" ? (
                      <MetricTabs modules={activeServiceModules} activeModule={activeMetricModule} setActiveModule={setActiveMetricModule} />
                    ) : null}
                    <ModuleMetricCards metrics={metrics} />

                    <div className="portal-content-grid">
                      <article className="portal-card">
                        <div className="portal-card__head">
                          <div>
                            <span className="feed-eyebrow">Compliance status</span>
                            <h3>Alleen checks uit actieve modules</h3>
                          </div>
                        </div>
                        <div className="compliance-grid">
                          {complianceChecks.map((item) => (
                            <div key={`${item.moduleLabel}-${item.label}`} className="compliance-card">
                              <strong>{item.label}</strong>
                              <span>{item.moduleLabel}</span>
                            </div>
                          ))}
                        </div>
                      </article>

                      <article className="portal-card">
                        <div className="portal-card__head">
                          <div>
                            <span className="feed-eyebrow">Project status</span>
                            <h3>Wat er nu loopt</h3>
                          </div>
                        </div>
                        <div className="project-list">
                          {projects.map((project) => (
                            <div key={project.title} className="project-item">
                              <div>
                                <strong>{project.title}</strong>
                                <span>{currentClient.projectStatus[project.moduleKey] || project.status}</span>
                              </div>
                            </div>
                          ))}
                        </div>
                      </article>
                    </div>

                    <article className="portal-card">
                      <div className="portal-card__head">
                        <div>
                          <span className="feed-eyebrow">Activity feed</span>
                          <h3>Updates, acties en bewijs van werk</h3>
                        </div>
                      </div>
                      <div className="portal-filters">
                        {filters.map((f) => (
                          <button
                            key={f}
                            className={`filter-chip ${activeFilter === f ? "active" : ""}`}
                            onClick={() => setActiveFilter(f)}
                          >
                            {f}
                          </button>
                        ))}
                      </div>
                      <div className="feed-list">
                        {filteredFeed.map((it, i) => (
                          <div key={`${it.moduleKey}-${i}`} className={`feed-item type-${it.type}`}>
                            <div className="feed-item-head">
                              <div className="feed-item-title">
                                <span className="feed-dot" style={{ background: dotColor[it.type] }} />
                                <strong>{it.title}</strong>
                              </div>
                              <div className="feed-item-meta">
                                {it.createdAt ? <span className="feed-time">{relativeTime(it.createdAt)}</span> : null}
                                <span className={`feed-status status-${it.type}`}>{it.status}</span>
                              </div>
                            </div>
                            <p>{it.body}</p>
                            <div className="feed-tags">
                              {it.moduleLabel ? <span className="feed-tag">{it.moduleLabel}</span> : null}
                              {it.tags.map((t) => <span key={t} className="feed-tag">{t}</span>)}
                            </div>
                            {it.cta && (
                              <button className={`feed-cta ${it.isCustom ? "feed-cta--custom" : ""}`}>{it.cta}</button>
                            )}
                          </div>
                        ))}
                      </div>
                    </article>

                    {!!currentClient.modules.files && (
                      <article className="portal-card">
                        <div className="portal-card__head">
                          <div>
                            <span className="feed-eyebrow">Bestanden</span>
                            <h3>Beschikbare documenten</h3>
                          </div>
                        </div>
                        <div className="file-list">
                          {currentClient.files.map((file) => <div key={file} className="file-pill">{file}</div>)}
                        </div>
                      </article>
                    )}
                  </main>
                </div>
              </div>
            </section>

            <SharedFooter />
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
    </script>
  </body>
</html>
