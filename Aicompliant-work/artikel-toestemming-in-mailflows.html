  <body class="page-dark"><div id="root"></div><script type="text/babel" src="components/Shared.jsx"></script><script type="text/babel">function Page(){return<><SharedHeader/><section className="subpage-hero compact"><div className="grid-bg" /><div className="container"><span className="eyebrow on-dark">E-mail</span><h1>Toestemming in mailflows: stille fouten</h1><p className="lead-on-dark">Mailflows lijken vaak goed te lopen, terwijl de bron van toestemming of de logica erachter al niet meer duidelijk is.</p></div></section><section className="article-page-section"><div className="container"><div className="article-layout"><article className="article-main"><h2>Waarom dit zo vaak onzichtbaar blijft</h2><p>E-mailmarketing groeit meestal door op bestaande lijsten, formulieren en automation. Daardoor blijven oude keuzes lang bestaan, ook als de context inmiddels is veranderd.</p><div className="article-divider" /><h2>Typische stille fouten</h2><ul><li>Onduidelijke herkomst van leads</li><li>Dubbele opt-in die niet overal gelijk is ingericht</li><li>Formulieren die niet duidelijk maken waarvoor toestemming wordt gegeven</li><li>Flows die draaien op lijsten met verouderde logica</li></ul><div className="article-divider" /><h2>Praktisch gevolg</h2><p>De e-mailmachine blijft draaien, maar niemand weet zeker of de basis nog goed genoeg is. Dat maakt voorbereiding op EU-regels en interne controle lastiger.</p></article><aside className="article-side"><h3>Waar wij op letten</h3><div className="side-block"><p>Toestemming, bron van data, flowlogica en koppelingen met de rest van je marketingstack.</p></div><div className="side-block"><p>Niet als juridisch advies, maar als praktische controle op mogelijke risico’s.</p></div><div className="side-block"><a className="btn btn-on-dark" href="aanbod.html">Bekijk aanbod <span className="arrow">→</span></a></div></aside></div></div></section><SharedFooter/></>}ReactDOM.createRoot(document.getElementById("root")).render(<Page />);</scri
